<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-ecom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="50%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0a0c1a"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg-ecom)"/>
  <rect width="800" height="450" rx="16" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Top Bar / App Mockup Header -->
  <rect x="40" y="35" width="720" height="380" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="65" cy="58" r="5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="82" cy="58" r="5" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="99" cy="58" r="5" fill="#10b981" fill-opacity="0.8"/>

  <rect x="120" y="48" width="230" height="20" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <text x="132" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">e-commerce-blush-two-82.vercel.app</text>

  <!-- Live Pulse Badge -->
  <rect x="660" y="47" width="80" height="22" rx="11" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-width="1"/>
  <circle cx="674" cy="58" r="4" fill="#c084fc"/>
  <text x="685" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#d8b4fe">LIVE APP</text>

  <!-- Hero Content inside Mockup -->
  <rect x="70" y="95" width="52" height="52" rx="14" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
  <text x="82" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="28">🛍️</text>

  <text x="135" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.5">E-Commerce <tspan fill="#c084fc">Store</tspan></text>
  <text x="135" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Modern shopping experience with product catalog, cart management &amp; checkout</text>

  <!-- Feature Grid -->
  <rect x="70" y="175" width="205" height="135" rx="10" fill="#160d26" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1"/>
  <text x="88" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="20">🛒</text>
  <text x="88" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Smart Cart</text>
  <text x="88" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Real-time state updates &amp;</text>
  <text x="88" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">persistent cart storage</text>
  <rect x="88" y="285" width="70" height="12" rx="3" fill="#a855f7" fill-opacity="0.2"/>
  <text x="93" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#c084fc">STATE SYNC</text>

  <rect x="295" y="175" width="205" height="135" rx="10" fill="#160d26" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1"/>
  <text x="313" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="20">🔍</text>
  <text x="313" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Product Filters</text>
  <text x="313" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Category, price sort &amp;</text>
  <text x="313" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">instant search filter</text>
  <rect x="313" y="285" width="60" height="12" rx="3" fill="#a855f7" fill-opacity="0.2"/>
  <text x="318" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#c084fc">FILTERING</text>

  <rect x="520" y="175" width="215" height="135" rx="10" fill="#160d26" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1"/>
  <text x="538" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="20">💳</text>
  <text x="538" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Checkout Flow</text>
  <text x="538" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Responsive billing</text>
  <text x="538" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">&amp; order review UI</text>
  <rect x="538" y="285" width="65" height="12" rx="3" fill="#a855f7" fill-opacity="0.2"/>
  <text x="543" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#c084fc">SEAMLESS UX</text>

  <!-- Bottom Tech Bar -->
  <rect x="70" y="335" width="665" height="50" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="90" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">TECH STACK:</text>
  <text x="180" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#c084fc">React.js • Tailwind CSS • Context API / Redux • JavaScript</text>
</svg>
