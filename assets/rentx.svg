<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-rentx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c102a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg-rentx)"/>
  <rect width="800" height="450" rx="16" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Top Bar / App Mockup Header -->
  <rect x="40" y="35" width="720" height="380" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="65" cy="58" r="5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="82" cy="58" r="5" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="99" cy="58" r="5" fill="#10b981" fill-opacity="0.8"/>

  <rect x="120" y="48" width="180" height="20" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <text x="132" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">rent-x-theta.vercel.app</text>

  <!-- Live Pulse Badge -->
  <rect x="660" y="47" width="80" height="22" rx="11" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-width="1"/>
  <circle cx="674" cy="58" r="4" fill="#818cf8"/>
  <text x="685" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#a5b4fc">LIVE APP</text>

  <!-- Hero Content inside Mockup -->
  <rect x="70" y="95" width="52" height="52" rx="14" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.5"/>
  <text x="82" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="28">🚗</text>

  <text x="135" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.5">RentX <tspan fill="#818cf8">Marketplace</tspan></text>
  <text x="135" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Smart vehicle &amp; asset rental hub with real-time availability and booking flows</text>

  <!-- Feature Grid -->
  <rect x="70" y="175" width="205" height="135" rx="10" fill="#0d1127" fill-opacity="0.8" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1"/>
  <text x="88" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="20">⚡</text>
  <text x="88" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Instant Booking</text>
  <text x="88" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">One-click reservation &amp;</text>
  <text x="88" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">instant confirmation</text>
  <rect x="88" y="285" width="70" height="12" rx="3" fill="#6366f1" fill-opacity="0.2"/>
  <text x="93" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#818cf8">FAST CHECKOUT</text>

  <rect x="295" y="175" width="205" height="135" rx="10" fill="#0d1127" fill-opacity="0.8" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1"/>
  <text x="313" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="20">📍</text>
  <text x="313" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Location Filters</text>
  <text x="313" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Geo-based search for</text>
  <text x="313" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">vehicles nearby</text>
  <rect x="313" y="285" width="60" height="12" rx="3" fill="#6366f1" fill-opacity="0.2"/>
  <text x="318" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#818cf8">NEAR YOU</text>

  <rect x="520" y="175" width="215" height="135" rx="10" fill="#0d1127" fill-opacity="0.8" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1"/>
  <text x="538" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="20">🛡️</text>
  <text x="538" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Verified Owners</text>
  <text x="538" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Secure KYC verification</text>
  <text x="538" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">&amp; transparent reviews</text>
  <rect x="538" y="285" width="65" height="12" rx="3" fill="#6366f1" fill-opacity="0.2"/>
  <text x="543" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#818cf8">100% VERIFIED</text>

  <!-- Bottom Tech Bar -->
  <rect x="70" y="335" width="665" height="50" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="90" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">TECH STACK:</text>
  <text x="180" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#818cf8">React • Tailwind CSS • JavaScript • REST APIs</text>
</svg>
